<section class="pagina-auth">
  <div class="contenedor-auth">
    <div class="auth-presentacion">
      <h1>¡Bienvenido a <span>ChambaFast</span>!</h1>
      <p>
        Conecta con nuevas oportunidades laborales y encuentra el camino para desarrollar tu
        talento.
      </p>
      <div class="auth-icono"><i class="bi bi-briefcase-fill"></i></div>
    </div>

    <div class="auth-formulario">
      <h2>Iniciar sesión</h2>
      <p class="subtitulo">Ingresa a tu cuenta para continuar.</p>

      <form (ngSubmit)="iniciarSesion()" #formulario="ngForm">
        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            [(ngModel)]="correo"
            placeholder="ejemplo@correo.com"
            required
            email
          />
        </div>

        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            [(ngModel)]="contrasena"
            placeholder="Ingresa tu contraseña"
            required
          />
        </div>

        <button type="submit" class="btn-auth" [disabled]="procesando">Iniciar sesión</button>

        @if (mensaje) {
          <p class="mensaje">{{ mensaje }}</p>
        }
      </form>

      <p class="texto-registro">
        ¿Todavía no tienes una cuenta?
        <a routerLink="/registro">Regístrate aquí</a>
      </p>

      <a routerLink="/" class="volver">Volver al inicio</a>
    </div>
  </div>
</section>
