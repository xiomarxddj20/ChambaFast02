<section class="pagina-auth">
  <div class="contenedor-auth registro-contenedor">

    <div class="auth-presentacion">
      <h1>Únete a <span>ChambaFast</span></h1>
      <p>
        Crea tu cuenta y comienza a descubrir oportunidades,
        conectar con empresas o impulsar tu emprendimiento.
      </p>
      <div class="auth-icono"><i class="bi bi-rocket-takeoff-fill"></i></div>
    </div>

    <div class="auth-formulario">
      <h2>Crear una cuenta</h2>
      <p class="subtitulo">Completa tus datos para registrarte.</p>

      <form (ngSubmit)="registrarUsuario()" #formulario="ngForm">

        <div class="campo">
          <label for="nombre">Nombres</label>
          <input
            type="text"
            id="nombre"
            name="nombre"
            [(ngModel)]="nombre"
            placeholder="Ingresa tus nombres"
            required
          >
        </div>

        <div class="campo">
          <label for="apellido">Apellidos</label>
          <input
            type="text"
            id="apellido"
            name="apellido"
            [(ngModel)]="apellido"
            placeholder="Ingresa tus apellidos"
            required
          >
        </div>

        <div class="campo">
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            name="correo"
            [(ngModel)]="correo"
            placeholder="ejemplo@correo.com"
            required
            email
          >
        </div>

        <div class="campo">
          <label for="telefono">Número de celular</label>
          <input
            type="tel"
            id="telefono"
            name="telefono"
            [(ngModel)]="telefono"
            placeholder="Ej. 987654321"
            required
          >
        </div>

        
        <div class="campo">
          <label for="tipoUsuario">
            ¿Cómo deseas utilizar ChambaFast?
          </label>

          <select
            id="tipoUsuario"
            name="tipoUsuario"
            [(ngModel)]="tipoUsuario"
            required
          >
            <option value="" disabled>
              Selecciona una opción
            </option>

            <option value="postulante">
              Busco empleo
            </option>

            <option value="empresa">
              Soy empresa o emprendedor
            </option>
          </select>
        </div>


        <div class="campo">
          <label for="contrasena">Contraseña</label>
          <input
            type="password"
            id="contrasena"
            name="contrasena"
            [(ngModel)]="contrasena"
            placeholder="Mínimo 8 caracteres"
            required
          >
        </div>

        <div class="campo">
          <label for="confirmarContrasena">Confirmar contraseña</label>
          <input
            type="password"
            id="confirmarContrasena"
            name="confirmarContrasena"
            [(ngModel)]="confirmarContrasena"
            placeholder="Repite tu contraseña"
            required
          >
        </div>

        <button type="submit" class="btn-auth">
          Crear cuenta
        </button>

        @if (mensaje) {
          <p class="mensaje">{{ mensaje }}</p>
        }

      </form>

      <p class="texto-registro">
        ¿Ya tienes una cuenta?
        <a routerLink="/login">Inicia sesión</a>
      </p>

      <a routerLink="/" class="volver">Volver al inicio</a>
    </div>

  </div>
</section>
