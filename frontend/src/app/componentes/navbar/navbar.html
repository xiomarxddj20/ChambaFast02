<header class="navbar">
  <div class="contenedor-navbar">
    <a routerLink="/" class="logo">Chamba<span>Fast</span></a>
    <nav class="menu">
      <a routerLink="/">Inicio</a>
      <a routerLink="/empleos">Empleos</a>
      <a routerLink="/emprendimientos">Emprendimientos</a>
    </nav>
    <div class="acciones">
      @if (usuario) {
        <a [routerLink]="panel" class="btn-login">Mi panel</a>
        <button type="button" class="btn-registro" (click)="salir()">Salir</button>
      } @else {
        <a routerLink="/login" class="btn-login">Iniciar sesión</a>
        <a routerLink="/registro" class="btn-registro">Registrarse</a>
      }
    </div>
  </div>
</header>
